<ng-container *ngIf="!isLoginPage">

  <!-- =====================================================
       PREMIUM HEADER
       ===================================================== -->
  <header class="announcement-bar">

    <div class="announcement-container">

      <!-- =================================================
           TOP ROW
           MOBILE:
           LOGO + BRAND              MY ORDERS
           ================================================= -->

<div class="announcement-top-row">

  <!-- BRAND CARD -->
  <a
    routerLink="/"
    class="brand-card"
    aria-label="Bros IT Solutions Home"
  >

    <span class="brand-logo-box">
      <img
        src="../assets/img/bros-logo.jpg"
        alt="Bros IT Solutions"
        class="brand-logo"
      />
    </span>

    <span class="brand-name">
      <span class="brand-bros">BROS</span>
      <span class="brand-it">IT SOLUTIONS</span>
    </span>

  </a>


  <!-- MY ORDERS -->
  <a
    routerLink="/my_order"
    class="my-orders-card"
    aria-label="My Orders"
  >

    <span class="orders-icon-box">
      <i class="bi bi-bag-check-fill"></i>
      <span class="orders-dot"></span>
    </span>

    <span class="orders-text">
      My Orders
    </span>

  </a>

</div>


      <!-- =================================================
           DELIVERY CARD
           MOBILE + DESKTOP
           ================================================= -->

      <a
        routerLink="/profile"
        class="delivery-card"
        aria-label="Select delivery address"
      >

        <span class="delivery-icon-box">

          <i class="bi bi-geo-alt-fill"></i>

        </span>


        <span class="delivery-info">

          <span class="delivery-caption">
            DELIVER TO
          </span>

          <span class="delivery-address">
            Select delivery address
          </span>

        </span>


        <span class="delivery-chevron">

          <i class="bi bi-chevron-right"></i>

        </span>

      </a>


      <!-- =================================================
           CONTACT
           DESKTOP ONLY
           ================================================= -->

      <div class="desktop-contact">

        <a
          routerLink="/contact"
          class="contact-card"
        >

          <span class="contact-icon-box">

            <i class="bi bi-headset"></i>

          </span>

          <span class="contact-info">

            <span class="contact-caption">
              NEED HELP?
            </span>

            <span class="contact-title">
              Contact Us
            </span>

          </span>

          <span class="contact-arrow">

            <i class="bi bi-arrow-up-right"></i>

          </span>

        </a>

      </div>

    </div>

  </header>


  <!-- =====================================================
       STICKY NAVIGATION
       ===================================================== -->

  <div
    class="app-sticky-nav"
    #headerStack
    *ngIf="showNavAndCategoryBar"
  >

    <app-navbar></app-navbar>

    <app-category-bar></app-category-bar>

  </div>

</ng-container>


<!-- =======================================================
     MAIN
     ======================================================= -->

<main
  class="app-main"
  [style.--header-height.px]="isLoginPage ? 0 : headerHeight"
>

  <router-outlet></router-outlet>

</main>


<!-- =======================================================
     FOOTER
     ======================================================= -->

<app-footer
  *ngIf="!isLoginPage"
></app-footer>


<!-- =======================================================
     LOGIN POPUP
     ======================================================= -->

<app-login-popup
  *ngIf="!isLoginPage"
></app-login-popup>


<!-- =======================================================
     MOBILE BOTTOM NAV
     ======================================================= -->

<app-mobile-bottom-nav
  *ngIf="!isLoginPage"
></app-mobile-bottom-nav>
